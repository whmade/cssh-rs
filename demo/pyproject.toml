[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cssh-rs-demo"
version = "0.1.0"
description = "Scripted screen-recording demo for cssh-rs."
requires-python = ">=3.14"
dependencies = [
    "cssh-rs-automation",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "pyrefly==1.1.1",
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["cssh_rs_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "C90",  # mccabe complexity
    "I",    # flake8 import ordering (isort)
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]

[tool.pyrefly]
project-includes = ["cssh_rs_demo"]
python-version = "3.14.6"
