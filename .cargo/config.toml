[alias]
lint = "clippy --workspace --all-targets --all-features -- -D warnings"
xtask = "run --package xtask --"
docs = "doc --bins --lib --no-deps"
# There is currently no single command to run all tests
# https://github.com/rust-lang/cargo/issues/6669
doc-tests = "test --doc"
tests = "test --workspace --all-targets"
release = "build -r"

[build]
rustdocflags = ["--document-private-items"]

# Statically link the MSVC C runtime so cssh-rs.exe runs on Windows hosts
# that do not have the Visual C++ Redistributable installed. Without this
# the binary fails to launch with `VCRUNTIME140.dll was not found`.
# See https://github.com/whmade/cssh-rs/issues/136 and
# https://rust-lang.github.io/rfcs/1721-crt-static.html.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
