[alias]
lint = "clippy --workspace --all-targets --all-features -- -D warnings"
xtask = "run --package xtask --"
docs = "doc --bins --lib --no-deps"
# There is currently no single command to run all tests
# https://github.com/rust-lang/cargo/issues/6669
doc-tests = "test --doc"
tests = "test --workspace --all-targets"
release = "build -r"

[build]
rustdocflags = ["--document-private-items"]

# Statically link the MSVC C runtime so cssh-rs.exe runs on Windows hosts
# that do not have the Visual C++ Redistributable installed.
# See https://github.com/whmade/cssh-rs/issues/136
[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
