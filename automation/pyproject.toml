[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cssh-rs-automation"
version = "0.1.0"
description = "Shared desktop-automation library for cssh-rs, used by the E2E suites and the demo recorder."
requires-python = ">=3.14"
dependencies = [
    "robotframework==7.5.1",
    "pyautogui==0.9.54",
    "pywinctl==0.4.1",
    "pyperclip==1.11.0",
    "cryptography==50.0.2",
    "mss==10.2.0",
    "imageio==2.38.1",
    "imageio-ffmpeg==0.8.1",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.4",
    "pyrefly==1.4.1",
    "pytest==9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cssh_rs_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "C90",  # mccabe complexity
    "I",    # flake8 import ordering (isort)
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]

[tool.pyrefly]
project-includes = ["cssh_rs_automation"]
python-version = "3.14.6"
