[package]
name = "cssh-rs-platform-windows"
version.workspace = true
edition = "2021"
license-file = "../LICENSE.txt"

[features]
# Exposes the `mockall`-generated `MockWindowsApi` so dependent crates can
# unit-test code that takes `&dyn WindowsApi` without pulling the real
# Windows APIs at test time. Enabled by `cssh-rs-core` via `dev-dependencies`.
mock = ["dep:mockall"]

[dependencies]
cssh-rs-platform = { path = "../cssh-rs-platform" }
log = "0.4.31"
mockall = { version = "0.15.0", optional = true }
os_info = { version = "3.15.0", default-features = false }
tokio = { version = "1.52.3", features = ["io-util", "net", "rt", "sync"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
mockall = "0.15.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
