# The demo recorder captures the desktop at its native resolution, and
# windows-latest defaults to a cramped 1024x768; switch to a larger mode.

name: Set display resolution
description: Switch the windows-latest primary display to a fixed resolution for demo recording.

inputs:
  width:
    description: Target desktop width in pixels.
    required: false
    default: "1600"
  height:
    description: Target desktop height in pixels.
    required: false
    default: "900"

runs:
  using: composite
  steps:
    - name: Set display resolution
      shell: pwsh
      env:
        TARGET_WIDTH: ${{ inputs.width }}
        TARGET_HEIGHT: ${{ inputs.height }}
      run: |
        $width = [int]$env:TARGET_WIDTH
        $height = [int]$env:TARGET_HEIGHT
        # The DEVMODE struct is built and passed entirely inside this compiled
        # helper: marshalling a boxed value-type struct with ByValTStr fields
        # through PowerShell's [ref] mangles it and ChangeDisplaySettings then
        # rejects it with ERROR_INVALID_PARAMETER. Only width/height cross the
        # PowerShell boundary. Flagging just dmPelsWidth/dmPelsHeight in dmFields
        # tells ChangeDisplaySettings to keep the current colour depth and
        # refresh rate, so there is no need to read the current mode first.
        # https://learn.microsoft.com/windows/win32/api/winuser/nf-winuser-changedisplaysettingsa
        $src = @'
        using System;
        using System.Runtime.InteropServices;
        public class Disp {
          [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
          struct DEVMODE {
            [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmDeviceName;
            public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
            public int dmFields;
            public short dmOrientation, dmPaperSize, dmPaperLength, dmPaperWidth, dmScale, dmCopies, dmDefaultSource, dmPrintQuality;
            public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
            [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmFormName;
            public short dmLogPixels;
            public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
            public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2;
            public int dmPanningWidth, dmPanningHeight;
          }
          [DllImport("user32.dll")] static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
          const int DM_PELSWIDTH = 0x80000, DM_PELSHEIGHT = 0x100000;
          public static int Apply(int width, int height) {
            DEVMODE dm = new DEVMODE();
            dm.dmDeviceName = new String(new char[32]);
            dm.dmFormName = new String(new char[32]);
            dm.dmSize = (short)Marshal.SizeOf(dm);
            dm.dmFields = DM_PELSWIDTH | DM_PELSHEIGHT;
            dm.dmPelsWidth = width;
            dm.dmPelsHeight = height;
            return ChangeDisplaySettings(ref dm, 0);  // flags 0: apply the change dynamically
          }
        }
        '@
        $DISP_CHANGE_SUCCESSFUL = 0
        Add-Type $src
        $ret = [Disp]::Apply($width, $height)
        if ($ret -ne $DISP_CHANGE_SUCCESSFUL) { throw "ChangeDisplaySettings failed with code $ret" }
        Add-Type -AssemblyName System.Windows.Forms
        $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
        Write-Host "Display is now $($b.Width)x$($b.Height)"
        if ($b.Width -ne $width -or $b.Height -ne $height) { throw "resolution not applied" }
