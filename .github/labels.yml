# GitHub Labels Configuration
#
# This file is the source of truth for the repository's labels.
# The sync-labels workflow (.github/workflows/sync-labels.yml)
# applies this file to GitHub on every push to main that touches
# it, creating or updating labels listed here and deleting any
# repo labels that are not. Add or change a label here, not in
# the GitHub UI.

# --- Default GitHub labels --------------------------------------------------

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "documentation"
  color: "006b75"
  description: "Improvements or additions to documentation"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

# --- Workflow / automation --------------------------------------------------

- name: "no-news-fragment-needed"
  color: "7bb344"
  description: "Indicates that this PR does not require a news fragment"

- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency"

- name: "internal"
  color: "d4c5f9"
  description: "Internal maintenance, tooling, or chores"

# --- Workstream -------------------------------------------------------------

- name: "workstream:code"
  color: "0e8a16"
  description: "Implementation work"

- name: "workstream:ci"
  color: "1d76db"
  description: "CI / testing infrastructure"

- name: "workstream:docs"
  color: "5319e7"
  description: "Documentation and authoring guides"

# --- Platform ---------------------------------------------------------------

- name: "platform:windows"
  color: "0366d6"
  description: "Affects Windows"

- name: "platform:linux"
  color: "fbca04"
  description: "Affects Linux"

- name: "platform:macos"
  color: "c5def5"
  description: "Affects macOS"

# --- Type -------------------------------------------------------------------

- name: "type:initiative"
  color: "5319e7"
  description: "Top-level initiative spanning multiple epics"

- name: "type:epic"
  color: "b60205"
  description: "Milestone-level epic (M0-M10)"

- name: "type:plugin"
  color: "ededed"
  description: "First-party plugin"

- name: "type:crate"
  color: "ededed"
  description: "New or restructured crate"

- name: "type:spike"
  color: "fef2c0"
  description: "Time-boxed investigation"

- name: "type:release"
  color: "f9d0c4"
  description: "Release engineering deliverable"

# --- Risk -------------------------------------------------------------------

- name: "risk:high"
  color: "d93f0b"
  description: "High-uncertainty work"

- name: "risk:gate"
  color: "e11d21"
  description: "Explicit GO/NO-GO gate"

# --- Agent skills (mattpocock-skills) ---------------------------------------
# Triage roles (docs/agents/triage-labels.md; wontfix is above) and wayfinder
# ticket types (docs/agents/issue-tracker.md).

- name: "needs-triage"
  color: "fbca04"
  description: "Maintainer needs to evaluate this issue"

- name: "needs-info"
  color: "d876e3"
  description: "Waiting on reporter for more information"

- name: "ready-for-agent"
  color: "0e8a16"
  description: "Fully specified, ready for an AFK agent"

- name: "ready-for-human"
  color: "1d76db"
  description: "Requires human implementation"

- name: "wayfinder:map"
  color: "5319e7"
  description: "Wayfinder map: index of decisions for a foggy effort"

- name: "wayfinder:research"
  color: "c5def5"
  description: "Wayfinder ticket resolved by reading primary sources (AFK)"

- name: "wayfinder:prototype"
  color: "c5def5"
  description: "Wayfinder ticket resolved by a throwaway prototype (HITL)"

- name: "wayfinder:grilling"
  color: "c5def5"
  description: "Wayfinder ticket resolved by a grilling session (HITL)"

- name: "wayfinder:task"
  color: "c5def5"
  description: "Wayfinder ticket: manual work that unblocks a decision"
