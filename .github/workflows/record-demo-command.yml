#
#   Record Demo Command
#
# On-demand demo-GIF preview: a maintainer comments `/record-demo`, this records
# the demo from the PR head and posts the GIF in a sticky comment.
#
# SECURITY: the `record` job builds and runs untrusted PR-head code; the
# maintainer gate, token isolation, and SHA pinning below exist to contain it.

name: Record Demo Command

on:
  issue_comment:
    types: [created]

# Deny by default; each job grants only what it needs.
permissions: {}

jobs:
  authorize:
    # Coarse pre-filter only; the real permission gate (maintain+) runs below,
    # not off author_association (which reflects relationship, not access).
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/record-demo')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      proceed: ${{ steps.command.outputs.match == 'true' && steps.authz.outputs.authorized == 'true' }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Match the exact command
        id: command
        uses: actions/github-script@v9
        with:
          script: |
            // Strict match so "please don't /record-demo yet" does not fire.
            const body = (context.payload.comment.body || '').trim();
            core.setOutput('match', /^\/record-demo\s*$/.test(body) ? 'true' : 'false');

      - name: Require maintain access
        id: authz
        if: steps.command.outputs.match == 'true'
        uses: actions/github-script@v9
        with:
          # role_name, not the coarse `permission` field (which collapses
          # maintain into write); reading it needs more than the default token.
          github-token: ${{ secrets.RECORD_DEMO_TOKEN }}
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const authorized = perm.role_name === 'admin' || perm.role_name === 'maintain';
            core.setOutput('authorized', authorized ? 'true' : 'false');
            if (!authorized) {
              core.notice(
                `Ignoring /record-demo from @${context.payload.comment.user.login} ` +
                  `(role: ${perm.role_name}); maintain or admin access is required.`,
              );
            }

      - name: Acknowledge with a reaction
        if: steps.authz.outputs.authorized == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.RECORD_DEMO_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Resolve PR head SHA and number
        id: resolve
        if: steps.authz.outputs.authorized == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            // issue_comment carries no pull_request payload; fetch it. The head
            // SHA pins the reviewed commit so a later force-push cannot swap in
            // different code after the command was issued.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('pr_number', String(context.issue.number));

  announce:
    needs: authorize
    if: needs.authorize.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Trusted: the issue_comment token can write, and no PR code is checked out.
    permissions:
      pull-requests: write
    steps:
      # Parallel to the slow `record` job, so the comment appears immediately.
      - name: Post the in-progress comment
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          number: ${{ needs.authorize.outputs.pr_number }}
          header: demo-preview
          message: |
            🤖 **Demo preview**
            Recording the demo GIF from this PR's head... :hourglass_flowing_sand:
            [Follow progress in this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

  record:
    needs: authorize
    if: needs.authorize.outputs.proceed == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    # Only authorized /record-demo runs reach this job, so an unrelated PR
    # comment cannot cancel a recording in progress.
    concurrency:
      group: record-demo-${{ github.event.issue.number }}
      cancel-in-progress: true
    # Untrusted PR code runs here: read-only token, no secrets.
    permissions:
      contents: read
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false

      - name: Read python version
        id: python
        shell: bash
        run: echo "version=$(cat .config/python.version)" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      # The runner ships the OpenSSH client but not the server the demo needs.
      - name: Enable OpenSSH server
        shell: pwsh
        run: Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0

      # demo-setup and demo-teardown are the PR-extensible hooks: their steps are
      # read from the checked-out PR head, so a PR can add setup/teardown a
      # preview picks up even though this workflow runs from the default branch.
      - name: Set up the demo desktop
        uses: ./.github/actions/demo-setup

      # Builds cssh-rs, installs the automation and demo packages, drives robot.
      - name: Record the demo GIF
        run: cargo xtask record-demo

      - name: Validate the GIF
        shell: pwsh
        run: |
          $gif = "target/demo/cssh-rs.gif"
          if (-not (Test-Path $gif)) { throw "GIF was not produced at $gif" }
          if ((Get-Item $gif).Length -eq 0) { throw "GIF at $gif is empty" }
          # verify() only parses the header; load every frame so a truncated or
          # corrupt GIF never reaches the reviewer.
          python -c "from PIL import Image, ImageSequence; im = Image.open('target/demo/cssh-rs.gif'); assert im.format == 'GIF', im.format; [frame.load() for frame in ImageSequence.Iterator(im)]"

      - name: Upload the demo GIF
        uses: actions/upload-artifact@v7
        with:
          name: demo-gif
          path: target/demo/cssh-rs.gif
          retention-days: 7

      # always(): undo the desktop setup even when recording failed above.
      - name: Tear down the demo desktop
        if: always()
        uses: ./.github/actions/demo-teardown

  comment:
    # always() + proceed gate: report record's outcome (even fail/cancel), stay
    # silent when denied. Needs `announce` so this writes the comment last.
    needs: [authorize, announce, record]
    if: always() && needs.authorize.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Trusted: body from workflow context and a trusted API query, never from
    # the record job's untrusted output.
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Build the final comment body
        uses: actions/github-script@v9
        env:
          RECORD_RESULT: ${{ needs.record.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const runUrl = process.env.RUN_URL;
            const result = process.env.RECORD_RESULT;
            let body;
            if (result === 'success') {
              // Resolve the artifact id so the link points at the zip, not the
              // run page. Trusted API call; reads no record-job output.
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              const gif = data.artifacts.find((a) => a.name === 'demo-gif');
              const artifactUrl = gif ? `${runUrl}/artifacts/${gif.id}` : runUrl;
              body =
                '🤖 **Demo preview**\n' +
                '✅ Recorded the demo GIF from this PR\'s head.\n' +
                `[Download the \`demo-gif\` artifact](${artifactUrl}) (zip, expires in 7 days) - unzip to view \`cssh-rs.gif\`.\n` +
                `[View the run](${runUrl}).`;
            } else {
              body =
                '🤖 **Demo preview**\n' +
                `❌ Recording did not complete (result: ${result}).\n` +
                `[Inspect the run](${runUrl}) for logs.`;
            }
            fs.writeFileSync('body.md', body + '\n');

      - name: Update the sticky comment
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          number: ${{ needs.authorize.outputs.pr_number }}
          header: demo-preview
          path: body.md
