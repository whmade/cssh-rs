#
#   cssh-rs Release Automation
#
# Triggered by tag pushes matching semantic version pattern.
# Creates optimized release builds and draft GitHub releases.
# Uses multi-runner approach: Windows for compilation, Ubuntu for packaging/API calls.

name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: &checkout-action actions/checkout@v7.0.1

      - name: Build release binary
        run: cargo release

      - name: Upload release binary
        uses: &upload-artifact-action actions/upload-artifact@v7
        with:
          name: cssh-rs-binary
          path: target/release/cssh-rs.exe
          retention-days: 1

  package-release:
    runs-on: &ubuntu-runner ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    needs: build-release
    steps:
      - uses: *checkout-action

      - name: Download release binary
        uses: &download-artifact-action actions/download-artifact@v8
        with:
          name: cssh-rs-binary
          path: ./artifacts

      - name: Create release package
        run: |
          VERSION="${{ github.ref_name }}"

          # Conventional Rust CLI asset name: <name>-v<version>-<target-triple>.
          ASSET="cssh-rs-v${VERSION}-x86_64-pc-windows-msvc"

          # Create package directory
          mkdir -p package

          # Copy binary. The version is carried by the zip filename below;
          # the executable inside the archive keeps its plain `cssh-rs.exe`
          # name so users can drop it straight onto PATH.
          cp artifacts/cssh-rs.exe package/cssh-rs.exe

          # Copy documentation
          cp README.md package/
          cp LICENSE.txt package/

          # Create zip archive with maximum compression
          (cd package && zip -9 "../${ASSET}.zip" ./*)

          # Generate the SHA-256 checksum sibling. Run from the directory the
          # zip lives in so the recorded filename is the bare basename, keeping
          # `sha256sum -c ${ASSET}.zip.sha256` portable for downloaders.
          sha256sum "${ASSET}.zip" > "${ASSET}.zip.sha256"

          # Get file size for logging
          SIZE=$(stat -c%s "${ASSET}.zip")
          echo "Package size: ${SIZE} bytes"

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "cssh-rs-v${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"

      - name: Upload release package
        uses: *upload-artifact-action
        with:
          name: release-package
          path: cssh-rs-v${{ github.ref_name }}-x86_64-pc-windows-msvc.zip*
          retention-days: 1

  create-draft-release:
    runs-on: *ubuntu-runner
    needs: package-release
    permissions:
      contents: write
    steps:
      - uses: *checkout-action

      - name: Download release package
        uses: *download-artifact-action
        with:
          name: release-package
          path: ./artifacts

      - name: Create draft release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const version = '${{ github.ref_name }}';

            // Read and process release template
            const templatePath = path.join(process.cwd(), 'templates', 'release_template.md');
            let releaseBody = fs.readFileSync(templatePath, 'utf8');

            // Extract current version's changelog from CHANGELOG.md
            const changelogPath = path.join(process.cwd(), 'CHANGELOG.md');
            const changelogContent = fs.readFileSync(changelogPath, 'utf8');

            // Parse changelog line by line to extract current version's content
            const lines = changelogContent.split('\n');
            let currentChangelog = 'No changelog entries found for this version.';
            let inTargetVersion = false;
            let changelogLines = [];

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];

              // Check if this is the start of our target version
              if (line.startsWith('## ') && line.includes(version)) {
                inTargetVersion = true;
                continue; // Skip the version header line
              }

              // Check if we've hit the next version (stop collecting)
              if (inTargetVersion && line.startsWith('## ')) {
                break;
              }

              // Collect lines for our target version
              if (inTargetVersion) {
                changelogLines.push(line);
              }
            }

            // Join the collected lines and trim
            if (changelogLines.length > 0) {
              currentChangelog = changelogLines.join('\n').trim();
            }

            // Replace placeholders
            releaseBody = releaseBody.replace(/\{\{VERSION\}\}/g, version);
            releaseBody = releaseBody.replace(/\{\{CHANGELOG\}\}/g, currentChangelog);

            console.log('Creating draft release for version:', version);
            console.log('Release body:');
            console.log(releaseBody);

            // Create draft release
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Version ${version}`,
              body: releaseBody,
              draft: true,
              prerelease: false
            });

            console.log('Draft release created:', release.data.html_url);

            // Upload the zip and its SHA-256 checksum sibling.
            const asset = `cssh-rs-v${version}-x86_64-pc-windows-msvc`;
            const assets = [
              { name: `${asset}.zip`, contentType: 'application/zip' },
              { name: `${asset}.zip.sha256`, contentType: 'text/plain' },
            ];

            for (const { name, contentType } of assets) {
              const data = fs.readFileSync(path.join(process.cwd(), 'artifacts', name));
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name,
                data,
                headers: {
                  'content-type': contentType,
                  'content-length': data.length
                }
              });
              console.log('Release asset uploaded successfully:', name);
            }

            console.log('Draft release is ready for review at:', release.data.html_url);
