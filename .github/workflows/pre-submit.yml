#
#   cssh-rs Pre-Submit CI
#
# Runs CI workflows based on changed files in pull requests.
# Uses paths-filter to determine which jobs need to run.

name: Pre-Submit CI

on:
  pull_request:
    branches:
      - main
      - "*-maintenance"

concurrency:
  group: pre-submit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: &runner ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.changes.outputs.src }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            src:
              - '.cargo/**'
              - '.config/coverage/**'
              - '.config/python.version'
              - 'tests/e2e/**'
              - 'automation/**'
              - 'demo/**'
              - 'cssh-rs/**'
              - 'cssh-rs-core/**'
              - 'cssh-rs-meta/**'
              - 'cssh-rs-platform/**'
              - 'cssh-rs-platform-linux/**'
              - 'cssh-rs-platform-macos/**'
              - 'cssh-rs-platform-windows/**'
              - 'cssh-rs-plugin-api/**'
              - 'cssh-rs-plugin-host/**'
              - 'cssh-rs-plugin-sdk/**'
              - 'cssh-rs-protocol/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'rust-toolchain.toml'
              - 'xtask/**'
              - 'rustfmt.toml'
            workflows:
              - '.github/workflows/pre-submit.yml'
              - '.github/workflows/post-submit.yml'
              - '.github/workflows/_*.yml'

  # Compile both toolchains once; `ci` and `e2e` restore these warm caches.
  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.src == 'true' || needs.detect-changes.outputs.workflows == 'true'
    uses: ./.github/workflows/_build.yml

  # No build artifacts needed, so this runs concurrently with `build`.
  checks-standalone:
    needs: detect-changes
    if: needs.detect-changes.outputs.src == 'true' || needs.detect-changes.outputs.workflows == 'true'
    uses: ./.github/workflows/_checks-standalone.yml

  # Build-dependent checks and the E2E suite run in parallel once `build` is
  # done, each reusing its warm caches. `coverage-report`/`diff-cover` need
  # only `ci`, so they no longer wait on the E2E run.
  ci:
    needs: build
    if: always() && needs.build.result == 'success'
    uses: ./.github/workflows/_shared-ci.yml

  e2e:
    needs: build
    if: always() && needs.build.result == 'success'
    uses: ./.github/workflows/_e2e.yml

  coverage-report:
    needs: ci
    if: always() && needs.ci.result == 'success'
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download Coverage XML Data
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml-data
          path: coverage-data/

      - name: Generate Code Coverage Summary
        id: coverage
        uses: ./.github/workflows/_coverage_report
        with:
          path: coverage-data/coverage.xml

      - name: Prepare comment content
        if: always()
        run: |
          mkdir -p comment
          echo "${{ github.event.number }}" > comment/pr_number.txt
          echo "coverage-report" > comment/header.txt

          # The coverage action outputs the report in the step outputs
          cat > comment/body.txt << 'EOF'
          🤖 **Coverage Check**
          Total Coverage: ${{ steps.coverage.outputs.percentage }}%
          ${{ steps.coverage.outputs.summary }}
          EOF

      - name: Upload comment artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-comment
          path: comment/

      - name: Check coverage threshold
        if: always()
        run: |
          echo Coverage is currently not being enforced.
          exit 0

          if (( $(bc -l <<< "${{ steps.coverage.outputs.percentage }} < 80") )); then
            exit 1
          fi

  diff-cover:
    needs: ci
    if: always() && needs.ci.result == 'success'
    runs-on: *runner
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read python version
        id: python
        run: |
          echo "version=$(cat .config/python.version)" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Read diff-cover version
        id: diffcover
        run: |
          echo "version=$(cat .config/coverage/diff-cover.version)" >> $GITHUB_OUTPUT

      - name: Cache pip packages
        uses: actions/cache@v6.1.0
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: |
            pip-diff-cover-${{ runner.os }}-v1-${{ steps.diffcover.outputs.version }}
          restore-keys: |
            pip-diff-cover-${{ runner.os }}-v1-

      - name: Install diff-cover
        run: pip install diff-cover==${{ steps.diffcover.outputs.version }}

      - name: Download Coverage XML Data
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml-data
          path: coverage-data/

      - name: Run diff-cover
        id: diff-cover
        run: |
          if diff-cover coverage-data/coverage.xml --fail-under=80 --format markdown:diff-cover.md; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi

      - name: Prepare comment content
        if: always()
        run: |
          mkdir -p comment
          echo "${{ github.event.number }}" > comment/pr_number.txt
          echo "diff-cover" > comment/header.txt

          # Write the header
          echo "🤖 **Diff Coverage Check**" > comment/body.txt
          echo "" >> comment/body.txt

          # Add status
          if [[ "${{ steps.diff-cover.outputs.result }}" == "success" ]]; then
            echo "✅ **Success!**" >> comment/body.txt
          else
            echo "❌ **Failed!**" >> comment/body.txt
          fi

          echo "" >> comment/body.txt

          # Add the diff-cover report
          cat diff-cover.md >> comment/body.txt

      - name: Upload comment artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diff-cover-comment
          path: comment/

      - if: steps.diff-cover.outputs.result == 'failed'
        run: exit 1

  # Post the coverage and diff-cover comments in-run for same-repo PRs, so they
  # land as soon as `coverage-report`/`diff-cover` finish instead of waiting on
  # the E2E suite. Fork PRs get them from `post-pr-comment.yml` instead, since a
  # fork's in-run token cannot post comments.
  post-coverage-comment:
    needs: coverage-report
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      actions: read
    uses: ./.github/workflows/_post-comment.yml
    with:
      artifact: coverage-comment

  post-diff-cover-comment:
    needs: diff-cover
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      actions: read
    uses: ./.github/workflows/_post-comment.yml
    with:
      artifact: diff-cover-comment

  ci-summary:
    needs: [detect-changes, build, checks-standalone, ci, e2e, coverage-report, diff-cover, post-coverage-comment, post-diff-cover-comment]
    if: always()
    runs-on: *runner
    steps:
      - run: |
          needs_json='${{ toJSON(needs) }}'
          failed=0
          echo "Job results:"
          for job in $(jq -r 'keys[]' <<< "$needs_json"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$needs_json")
            echo "- $job: $result"
            if [[ ! "$result" =~ ^(success|skipped)$ ]]; then
              failed=1
            fi
          done

          if [[ $failed -eq 1 ]]; then
            echo "❌ One or more jobs failed or were cancelled!"
            exit 1
          else
            echo "✅ All jobs succeeded or were skipped."
          fi
