# Regenerate the demo clip on demand and open a PR to review it before it goes
# live. Runs manually against the branch you dispatch it from (the "Use workflow
# from" selector), so a release maintenance branch can keep its own demo. Only
# `main` and `X.Y-maintenance` branches publish here; a feature branch's demo
# is previewed on demand via the `/record-demo` PR comment instead. The GIF is
# published to the orphan `demo-assets` branch the README links - never
# committed to a code branch - so clones stay lean, and GitHub renders the old
# and new GIF side by side in the review PR.
#
# Requires "Allow GitHub Actions to create and approve pull requests" under
# Settings > Actions > General.

name: Regenerate demo GIF

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate-demo:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Publishing is limited to main and X.Y-maintenance branches; any other
      # branch's demo is previewed via the `/record-demo` PR comment, not
      # published here. Passing the branch through `env` keeps it out of the
      # shell-injection path.
      - name: Validate the branch
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH" != "main" && ! "$BRANCH" =~ ^[0-9]+\.[0-9]+-maintenance$ ]]; then
            echo "Unsupported branch: '$BRANCH' (expected main or X.Y-maintenance)" >&2
            exit 1
          fi

      - name: Check out the branch
        uses: actions/checkout@v7.0.1

      - name: Read python version
        id: python
        shell: bash
        run: echo "version=$(cat .config/python.version)" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}

      # The runner ships the OpenSSH client but not the server the demo needs.
      - name: Enable OpenSSH server
        shell: pwsh
        run: Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0

      - name: Record the demo GIF
        run: cargo xtask record-demo

      - name: Validate the GIF before publishing
        shell: pwsh
        run: |
          $gif = "target/demo/cssh-rs.gif"
          if (-not (Test-Path $gif)) { throw "GIF was not produced at $gif" }
          if ((Get-Item $gif).Length -eq 0) { throw "GIF at $gif is empty" }
          # verify() only parses the header; load every frame so a truncated or
          # corrupt GIF never reaches the branch.
          python -c "from PIL import Image, ImageSequence; im = Image.open('target/demo/cssh-rs.gif'); assert im.format == 'GIF', im.format; [frame.load() for frame in ImageSequence.Iterator(im)]"

      # main -> cssh-rs.gif; X.Y-maintenance -> cssh-rs-X.Y.gif, so every branch
      # keeps its own clip on the shared asset branch.
      - name: Resolve the asset name for this branch
        id: asset
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "name=cssh-rs.gif" >> "$GITHUB_OUTPUT"
          else
            echo "name=cssh-rs-${BRANCH%-maintenance}.gif" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the demo-assets branch
        uses: actions/checkout@v7.0.1
        with:
          ref: demo-assets
          path: demo-assets

      - name: Place the regenerated GIF
        shell: pwsh
        run: Copy-Item target/demo/cssh-rs.gif "demo-assets/${{ steps.asset.outputs.name }}" -Force

      - name: Open a review PR on demo-assets
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          path: demo-assets
          base: demo-assets
          branch: regen-demo/${{ github.ref_name }}
          delete-branch: true
          commit-message: "demo: regenerate the ${{ github.ref_name }} demo clip"
          title: "demo: regenerate the ${{ github.ref_name }} demo clip"
          body: |
            Regenerated `${{ steps.asset.outputs.name }}` from `${{ github.ref_name }}` via `cargo xtask record-demo`.

            Review the rendered GIF diff before merging; merging publishes it to the
            `demo-assets` branch the README links.
