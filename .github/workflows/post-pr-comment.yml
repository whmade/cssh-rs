#
#   Post PR Comment Dispatch
#
# Dispatches comment artifacts to `_post-comment.yml` after a producing
# workflow completes. Same-repo Pre-Submit CI runs post their coverage and
# diff-cover comments in-run (see pre-submit.yml) so they need not wait on the
# E2E suite; those two artifacts are dispatched here only for fork PRs, whose
# in-run token is read-only. The news-fragment and demo comments are always
# dispatched here.

name: Post PR Comment

on:
  workflow_run:
    workflows: ["News Fragment Check", "Pre-Submit CI", "Record Demo Command"]
    types: [completed]

jobs:
  post-comment:
    # One matrix leg per comment artifact. Same-repo Pre-Submit CI runs post
    # their coverage/diff-cover comments in-run (see pre-submit.yml), so those
    # two artifacts are dropped here for same-repo runs. The routing lives in
    # matrix construction because the matrix context is unavailable in a
    # job-level `if` (evaluated before the matrix expands).
    strategy:
      matrix:
        artifact: >-
          ${{ github.event.workflow_run.head_repository.full_name == github.repository
              && fromJSON('["comment", "demo-comment"]')
              || fromJSON('["comment", "coverage-comment", "diff-cover-comment", "demo-comment"]') }}
      fail-fast: false
    # Pre-Submit CI runs are `pull_request`; the on-demand demo preview is an
    # `issue_comment` (`/record-demo`) run.
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'issue_comment'
    permissions:
      pull-requests: write
      actions: read
    uses: ./.github/workflows/_post-comment.yml
    with:
      artifact: ${{ matrix.artifact }}
      run-id: ${{ github.event.workflow_run.id }}
