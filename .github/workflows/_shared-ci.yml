#
#   cssh-rs Shared CI Logic
#
# Reusable workflow containing common CI jobs that can be called by both
# the main CI workflow and the coverage CI workflow.
# Uses YAML anchors where possible to reduce redundancy.
#
# Caching strategy: the workspace is compiled once per toolchain in a
# dedicated builder job, then every follow-up job restores that warm
# build instead of recompiling. There are two builders because the two
# toolchains produce incompatible artifacts (cargo fingerprints by rustc
# version + RUSTFLAGS):
#   - build-stable  : the pinned stable toolchain, consumed by lint,
#                     doc-tests and the xtask checks.
#   - build-nightly : nightly + `-C instrument-coverage` via cargo-llvm-cov,
#                     consumed only by the coverage `tests` job.
# Two cache layers cooperate per builder:
#   - Swatinem/rust-cache owns the cargo home (~/.cargo) and the pruned
#     dependency target; it also exports CARGO_INCREMENTAL=0.
#   - actions/cache owns the FULL, un-pruned `target` (including
#     cargo-llvm-cov's `target/llvm-cov-target`, which Swatinem strips as a
#     non-dependency artifact). This is what ships the instrumented test
#     binaries from build-nightly to the tests job.
# The `${{ github.sha }}` key suffix lets a builder save a per-commit cache
# that same-run consumers restore as an exact hit (zero recompile), while
# the restore-keys prefix gives the builder itself a warm incremental base
# from the previous run.

name: Shared CI Logic

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref or SHA to check out. Empty string falls back to the
          triggering event's default ref.
        type: string
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  # Keep the actions/cache `target` lean and machine-portable. Swatinem sets
  # this too, but setting it here guards the cache independently of step order.
  CARGO_INCREMENTAL: 0

jobs:
  build-stable:
    runs-on: &runner-version windows-latest
    steps:
      - uses: &checkout-action actions/checkout@v7.0.0
        with: &checkout-with
          ref: ${{ inputs.ref }}

      - uses: &rust-cache-action Swatinem/rust-cache@v2
        with: &rust-cache-stable
          shared-key: stable

      - uses: &target-cache actions/cache@v5.0.5
        with: &target-cache-stable
          path: target
          key: ${{ runner.os }}-target-stable-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-target-stable-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            ${{ runner.os }}-target-stable-

      - name: Build
        run: |
          cargo build --workspace --all-targets --profile dev --verbose
          cargo build --workspace --all-targets --profile test --verbose

      - name: Build docs
        run: cargo docs

  build-nightly:
    runs-on: *runner-version
    steps:
      - uses: *checkout-action
        with: *checkout-with

      - uses: *rust-cache-action
        with: &rust-cache-nightly
          shared-key: nightly

      - uses: *target-cache
        with: &target-cache-nightly
          path: target
          key: ${{ runner.os }}-target-nightly-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.config/coverage/nightly-toolchain.version') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-target-nightly-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.config/coverage/nightly-toolchain.version') }}-
            ${{ runner.os }}-target-nightly-

      - &read-nightly
        name: Read nightly toolchain version
        id: nightly
        shell: bash
        run: |
          echo "version=$(cat .config/coverage/nightly-toolchain.version)" >> $GITHUB_OUTPUT

      - &install-nightly
        name: Install nightly toolchain
        run: |
          rustup toolchain install ${{ steps.nightly.outputs.version }} --component llvm-tools

      - &install-llvm-cov
        name: Install cargo-llvm-cov
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-llvm-cov
          version: "^0.8.0"

      # Compile the instrumented test binaries (into target/llvm-cov-target)
      # without running them. `test --no-run` is the compile-only form; bare
      # `--no-run` is the deprecated report alias and does NOT build. The
      # feature/workspace flags MUST match the tests job's run so the restored
      # binaries are fingerprint-compatible and are not recompiled there.
      - name: Build instrumented test binaries
        run: cargo +${{ steps.nightly.outputs.version }} llvm-cov test --no-run --all-features --workspace

  check-format:
    runs-on: *runner-version
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - name: Check format
        run: cargo fmt -- --check

  check-lint:
    runs-on: *runner-version
    needs: build-stable
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - uses: *rust-cache-action
        with: *rust-cache-stable
      - uses: *target-cache
        with: *target-cache-stable
      - name: Run linter
        run: cargo lint

  tests:
    timeout-minutes: 30
    runs-on: *runner-version
    needs: build-nightly
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - uses: *rust-cache-action
        with: *rust-cache-nightly
      - uses: *target-cache
        with: *target-cache-nightly

      - *read-nightly
      - *install-nightly
      - *install-llvm-cov

      - name: Run tests with coverage
        run: |
          $nightly = "${{ steps.nightly.outputs.version }}"
          $ignoreRegex = (Get-Content -Raw ".config/coverage/ignore-filename.regex").Trim()
          # Reset only the profiling counters; keep the instrumented binaries
          # restored from build-nightly so this job runs them without recompiling.
          cargo +$nightly llvm-cov clean --workspace --profraw-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # PowerShell does not propagate native-command exit codes by default,
          # so capture the cargo test exit and surface it after writing reports.
          # --no-fail-fast keeps later test binaries running when an earlier one
          # blows up, so we get full coverage instrumentation for all of them.
          cargo +$nightly llvm-cov --all-features --workspace --no-fail-fast --no-report -- --no-capture
          $testExit = $LASTEXITCODE
          cargo +$nightly llvm-cov report --cobertura --output-path coverage.xml --ignore-filename-regex $ignoreRegex
          $cobExit = $LASTEXITCODE
          cargo +$nightly llvm-cov report --html --output-dir coverage_html --ignore-filename-regex $ignoreRegex
          $htmlExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          if ($cobExit -ne 0) { exit $cobExit }
          if ($htmlExit -ne 0) { exit $htmlExit }

      - name: Upload Coverage XML Data
        # Run even if tests failed so downstream coverage consumers still
        # get a partial report for the test binaries that did finish.
        if: always()
        uses: &upload-artifact-action actions/upload-artifact@v7
        with:
          name: coverage-xml-data
          path: coverage.xml
          retention-days: 1

      - name: Upload Coverage HTML Report
        if: always()
        uses: *upload-artifact-action
        with:
          name: coverage-html-report
          path: coverage_html/
          retention-days: 1

  tests-docs:
    timeout-minutes: 15
    runs-on: *runner-version
    needs: build-stable
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - uses: *rust-cache-action
        with: *rust-cache-stable
      - uses: *target-cache
        with: *target-cache-stable
      - name: Run tests docs
        run: cargo doc-tests

  check-readme-help:
    runs-on: *runner-version
    needs: build-stable
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - uses: *rust-cache-action
        with: *rust-cache-stable
      - uses: *target-cache
        with: *target-cache-stable
      - name: Run check-readme-help
        run: cargo xtask check-readme-help

  check-typography:
    runs-on: *runner-version
    needs: build-stable
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - uses: *rust-cache-action
        with: *rust-cache-stable
      - uses: *target-cache
        with: *target-cache-stable
      - name: Run check-typography
        run: cargo xtask check-typography

  # Lint, format, type-check and test the Python E2E harness as four parallel
  # jobs on windows-latest, the harness's target platform. Deps via pyproject.toml.
  e2e-harness-lint:
    runs-on: *runner-version
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - &e2e-read-python
        name: Read python version
        id: python
        shell: bash
        run: echo "version=$(cat .config/python.version)" >> $GITHUB_OUTPUT
      - &e2e-setup-python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: tests/e2e/harness/pyproject.toml
      - &e2e-install
        name: Install harness package with dev tooling
        working-directory: tests/e2e/harness
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: tests/e2e/harness
        run: ruff check

  e2e-harness-format:
    runs-on: *runner-version
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - *e2e-read-python
      - *e2e-setup-python
      - *e2e-install
      - name: Ruff format check
        working-directory: tests/e2e/harness
        run: ruff format --check

  e2e-harness-typecheck:
    runs-on: *runner-version
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - *e2e-read-python
      - *e2e-setup-python
      - *e2e-install
      - name: Pyrefly type check
        working-directory: tests/e2e/harness
        run: pyrefly check

  e2e-harness-test:
    runs-on: *runner-version
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - *e2e-read-python
      - *e2e-setup-python
      - *e2e-install
      - name: Pytest
        working-directory: tests/e2e/harness
        run: pytest

  # Compile-only cross-checks for the portable crate subset on native
  # runners. cssh-rs, cssh-rs-core, and cssh-rs-protocol are still
  # Windows-tied (ported off the windows crate in M4/M5) and are excluded;
  # the --exclude form fails loudly if a portable crate later grows a
  # Windows dependency.
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - uses: *rust-cache-action
        with:
          shared-key: linux-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}
      - name: Add target
        run: rustup target add x86_64-unknown-linux-gnu
      - name: Check portable crates
        run: cargo check --workspace --target x86_64-unknown-linux-gnu --exclude cssh-rs --exclude cssh-rs-core --exclude cssh-rs-protocol

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: *checkout-action
        with: *checkout-with
      - uses: *rust-cache-action
        with:
          shared-key: macos-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}
      - name: Add target
        run: rustup target add aarch64-apple-darwin
      - name: Check portable crates
        run: cargo check --workspace --target aarch64-apple-darwin --exclude cssh-rs --exclude cssh-rs-core --exclude cssh-rs-protocol
