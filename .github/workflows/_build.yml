#
#   cssh-rs Build
#
# Reusable workflow that compiles the workspace once per toolchain and
# warms the caches every downstream job restores. Two builders because
# cargo fingerprints by rustc version + RUSTFLAGS, so stable and nightly
# (+instrument-coverage) artifacts differ. Per builder, Swatinem/rust-cache
# owns ~/.cargo + the pruned dependency target; actions/cache owns the full
# target (incl. llvm-cov-target) that carries the instrumented binaries to
# the tests job. The github.sha key suffix gives same-run consumers an exact
# hit; restore-keys gives the builder a warm base from the previous run.
#
# Callers invoke this first and gate `_shared-ci.yml` and `_e2e.yml` on it
# with `needs: build`, so those workflows restore a warm exact-sha cache
# instead of recompiling.

name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref or SHA to check out. Empty string falls back to the
          triggering event's default ref.
        type: string
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  # Keep the actions/cache `target` lean and machine-portable. Swatinem sets
  # this too, but setting it here guards the cache independently of step order.
  CARGO_INCREMENTAL: 0

jobs:
  build-stable:
    runs-on: &runner-version windows-latest
    steps:
      - uses: &checkout-action actions/checkout@v7.0.1
        with: &checkout-with
          ref: ${{ inputs.ref }}

      - uses: &rust-cache-action Swatinem/rust-cache@v2
        with: &rust-cache-stable
          shared-key: stable

      - uses: &target-cache actions/cache@v6.1.0
        with: &target-cache-stable
          path: target
          key: ${{ runner.os }}-target-stable-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-target-stable-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            ${{ runner.os }}-target-stable-

      - name: Build
        run: |
          cargo build --workspace --all-targets --profile dev --verbose
          cargo build --workspace --all-targets --profile test --verbose

      - name: Build docs
        run: cargo docs

  build-nightly:
    runs-on: *runner-version
    steps:
      - uses: *checkout-action
        with: *checkout-with

      - uses: *rust-cache-action
        with: &rust-cache-nightly
          shared-key: nightly

      - uses: *target-cache
        with: &target-cache-nightly
          path: target
          key: ${{ runner.os }}-target-nightly-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', '.config/coverage/nightly-toolchain.version') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-target-nightly-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', '.config/coverage/nightly-toolchain.version') }}-
            ${{ runner.os }}-target-nightly-

      - name: Read nightly toolchain version
        id: nightly
        shell: bash
        run: |
          echo "version=$(cat .config/coverage/nightly-toolchain.version)" >> $GITHUB_OUTPUT

      - name: Install nightly toolchain
        run: |
          rustup toolchain install ${{ steps.nightly.outputs.version }} --component llvm-tools

      - name: Install cargo-llvm-cov
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-llvm-cov
          version: "^0.8.0"

      # cargo-llvm-cov has no build-only mode (its `--no-run` is the deprecated
      # `report` alias), so source the coverage env via `show-env` and run a
      # plain `cargo test --no-run`. The tests job sources the same env, so the
      # binaries are fingerprint-identical and restored without a recompile.
      # `--with-pwsh-env-prefix` emits `$env:K=V` lines.
      - name: Build instrumented test binaries
        run: |
          $nightly = "${{ steps.nightly.outputs.version }}"
          # Confirm every line is a fully-escaped `$env:NAME="..."` assignment
          # so Invoke-Expression cannot run anything show-env did not emit.
          $covEnv = cargo +$nightly llvm-cov show-env --with-pwsh-env-prefix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($line in $covEnv) {
            if ($line -and $line -notmatch '^\$env:\w+="(`u\{[0-9a-fA-F]+\})*"$') {
              Write-Error "Unexpected llvm-cov show-env output: $line"; exit 1
            }
          }
          $covEnv | Invoke-Expression
          cargo +$nightly test --no-run --all-features --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
